<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人图书收藏管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>📚 个人图书收藏管理系统</h1>
      <p class="subtitle">云南大学 软件开发综合实践 自主实践应用</p>
    </header>

    <!-- 图书录入表单 -->
    <section class="card form-section">
      <h2>新增图书收藏</h2>
      <form id="book-form">
        <div class="form-row">
          <div class="form-group">
            <label for="book-title">书名 <span class="required">*</span></label>
            <input type="text" id="book-title" placeholder="例如：深入理解计算机系统">
          </div>
          <div class="form-group">
            <label for="book-author">作者 <span class="required">*</span></label>
            <input type="text" id="book-author" placeholder="例如：Randal E. Bryant">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="book-category">专业分类</label>
            <select id="book-category">
              <option value="专业核心">专业核心</option>
              <option value="算法技术">算法技术</option>
              <option value="文学经典">文学经典</option>
              <option value="社科哲学">社科哲学</option>
            </select>
          </div>
          <div class="form-group">
            <label for="book-rating">个人评分</label>
            <select id="book-rating">
              <option value="5">★★★★★ (5星力荐)</option>
              <option value="4">★★★★☆ (4星推荐)</option>
              <option value="3">★★★☆☆ (3星尚可)</option>
              <option value="2">★★☆☆☆ (2星一般)</option>
              <option value="1">★☆☆☆☆ (1星不推荐)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="book-notes">短评心得</label>
          <input type="text" id="book-notes" placeholder="记录阅读体会或推荐理由（可选）">
        </div>

        <p class="error-tip" id="form-tip"></p>
        <button type="submit" class="btn btn-primary" id="add-btn">➕ 添加到收藏</button>
      </form>
    </section>

    <!-- 检索与筛选工具栏 -->
    <section class="card filter-section">
      <div class="filter-row">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 实时搜索书名或作者...">
        </div>
        <div class="category-filter">
          <select id="filter-category">
            <option value="all">全部分类</option>
            <option value="专业核心">专业核心</option>
            <option value="算法技术">算法技术</option>
            <option value="文学经典">文学经典</option>
            <option value="社科哲学">社科哲学</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 图书列表展示区 -->
    <section class="card list-section">
      <div class="list-header">
        <h2>图书列表</h2>
        <span class="count-badge" id="book-count">共 0 本</span>
      </div>

      <div class="book-list" id="book-list">
        <!-- 动态渲染图书卡片 -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
